# Whole app:            docker compose up -d --build   ->  http://localhost:8080
# Database only (dev):  docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
      POSTGRES_DB: payroll
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://payroll:payroll@db:5432/payroll
      # Change these in a .env file next to this compose file - see backend/.env.example
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      REQUIRE_SEPARATE_APPROVER: ${REQUIRE_SEPARATE_APPROVER:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@clearpay4u.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      # Email: Mailpit catches everything locally (http://localhost:8025). Point these at a real SMTP server in production.
      APP_URL: ${APP_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ClearPay4U <no-reply@clearpay4u.local>}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # inbox in the browser

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
