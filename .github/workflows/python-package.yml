name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payroll
          POSTGRES_PASSWORD: payroll
          POSTGRES_DB: payroll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payroll"
          --health-interval 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql://payroll:payroll@localhost:5432/payroll_test

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 -r requirements.txt
    - name: Lint (syntax errors and undefined names fail the build)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test (memory, SQLite and PostgreSQL)
      run: pytest -v -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install and build
      run: |
        npm install
        npm run build

  docker-stack:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
    - uses: actions/checkout@v4
    - name: Build and start db + api + web
      run: docker compose up -d --build
    - name: Smoke test through nginx
      run: |
        for i in $(seq 1 30); do
          curl -fs http://localhost:8080/api/health && break
          sleep 2
        done
        curl -fs http://localhost:8080/ | grep -q '<div id="root">'
        TOKEN=$(curl -fs -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
          -d '{"email":"admin@clearpay4u.local","password":"ChangeMe123"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
        test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/clients)" = "401"
        curl -fs -X POST http://localhost:8080/api/clients -H 'Content-Type: application/json' \
          -H "Authorization: Bearer $TOKEN" -d '{"id":"ci-test","legal_name":"CI Test","state":"TG"}'
        curl -fs http://localhost:8080/api/clients -H "Authorization: Bearer $TOKEN" | grep -q ci-test
        echo "Stack is up and data is stored in Postgres"
        # Employee invite is emailed (Mailpit catches it)
        curl -fs -X POST http://localhost:8080/api/clients/ci-test/employees -H 'Content-Type: application/json' \
          -H "Authorization: Bearer $TOKEN" \
          -d '{"code":"E1","name":"Ravi","joined_on":"2026-04-01","components":{"basic":30000}}' > /dev/null
        curl -fs -X POST http://localhost:8080/api/clients/ci-test/employees/E1/invite -H 'Content-Type: application/json' \
          -H "Authorization: Bearer $TOKEN" -d '{"email":"ravi@example.com"}' | grep -q '"email_sent":true'
        curl -fs http://localhost:8025/api/v1/messages | grep -q 'ravi@example.com'
        echo "Invite email delivered to Mailpit"
    - name: Production compose file is valid
      run: |
        cp deploy/.env.example /tmp/prod.env
        sed -i 's/^\(POSTGRES_PASSWORD\|SECRET_KEY\|FIELD_ENCRYPTION_KEY\|ADMIN_PASSWORD\)=$/\1=ci-value/; s/^ADMIN_EMAIL=$/ADMIN_EMAIL=ci@example.com/' /tmp/prod.env
        docker compose -f deploy/docker-compose.prod.yml --env-file /tmp/prod.env config --quiet
        bash -n deploy/*.sh
    - name: Logs on failure
      if: failure()
      run: docker compose logs
